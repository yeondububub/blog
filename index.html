<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="img/icon/favicon.svg" type="image/x-icon" />
  <title>Weniv Blog</title>

  <!-- google fonts (JetBrains Mono) & Pretendard -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- marked -->
  <script src="./library/marked.min.js"></script>

  <!-- hightlight.js -->
  <link rel="stylesheet" href="./library/highlight_default.min.css" />
  <script src="./library/highlight_highlight.min.js"></script>
  <link rel="stylesheet" href="./library/highlight_ally-light.min.css" />

  <!-- mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    if (window.mermaid) {
      mermaid.initialize({ startOnLoad: false, theme: 'default' });
    }
  </script>

  <!-- darkMode -->
  <script src="js/darkMode.js"></script>

  <!-- custom css -->
  <link rel="stylesheet" href=" style/style.css" />

  <!-- tailwind -->
  <script src="./library/tailwind-3.4.1.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Pretendard"', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', '"Helvetica Neue"', '"Segoe UI"', '"Apple SD Gothic Neo"', '"Noto Sans KR"', '"Malgun Gothic"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            primary: "#2e6ff2",
            background: "#fff",
            surface: "#121314",
            graylv1: "#f3f5fa",
            graylv2: "#d9dbe0",
            graylv3: "#8d9299",
            graylv4: "#47494d",
            error: "#ff3440",
            lowError: "#ffc533",
            activation: "#dee8ff",
          },
        },
      },
    };
  </script>
  <!-- // tailwind -->

  <style>
    /* 본문 및 제목: Pretendard (국내 개발/기술 블로그 표준 산세리프 서체) */
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    }

    h1, h2, h3, h4, h5, h6, #blog-title {
      font-family: 'Pretendard', sans-serif;
    }

    /* 코드 폰트: JetBrains Mono */
    code, pre {
      font-family: 'JetBrains Mono', monospace;
    }

    /* 1. 단일 백틱(`) 인라인 코드 : 회색 배경 박스 적용 */
    :not(pre) > code {
      background-color: #f3f5fa;
      color: #eb5757;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.875em;
      border: 1px solid #d9dbe0;
    }

    html.dark :not(pre) > code {
      background-color: #252830;
      color: #f87171;
      border-color: #374151;
    }

    html.dark body {
      background-color: #121314;
      color: #e2e8f0;
    }

    /* 2. 백틱 3개(```) 코드 블록 : pre 컨테이너 배경은 유지하되 내부 code 요소의 인라인 회색 박스는 제거 및 가로 스크롤 설정 */
    pre {
      white-space: pre !important;
      overflow-x: auto !important;
      word-break: normal !important;
    }

    pre > code {
      background-color: transparent !important;
      color: inherit;
      padding: 0 !important;
      border: none !important;
      border-radius: 0 !important;
      white-space: pre !important;
      word-break: normal !important;
    }

    @keyframes slideDown {
      from {
        transition: all 1s;
        height: 0px;
        opacity: 0;
      }

      to {
        opacity: 1;
        height: 60px;
      }
    }

    .markdown-cell>ul>li>p {
      display: inline-block;
    }
  </style>
</head>

<body class="font-sans w-full text-surface bg-white dark:bg-[#121314] dark:text-gray-100 transition-colors duration-200">
  <header class="relative bg-white dark:bg-[#18191c] mx-auto border-b border-gray-300 dark:border-gray-800 transition-colors duration-200">
    <nav class="container max-w-[1190px] mx-auto md:p-[19px] p-4 flex items-center relative">
      <!-- 블로그 제목 영역 -->
      <h1 id="blog-title" class="md:text-2xl text-lg leading-6 mr-auto font-semibold text-gray-900 dark:text-white cursor-pointer">
        WENIVLOG
      </h1>
      <!-- // 블로그 제목 영역 -->

      <!-- 메뉴 영역 -->
      <div class="md:hidden w-6 h-6">
        <button id="menu-button">
          <span class="sr-only">메뉴 열기</span>
        </button>
      </div>

      <div id="menu" class="hidden md:flex items-center">
        <!-- 메뉴 아이템들 -->
      </div>

      <button id="search-button" class="ml-10 md:hidden flex">
        <span class="sr-only">검색창 열기</span>
      </button>

      <div
        class="search-cont w-80 hidden md:block md:relative absolute z-10 rounded-2xl p-4 border border-graylv2 dark:border-gray-700 bottom-[-12px] right-2 xl:right-0 translate-y-full bg-background dark:bg-[#18191c] w-96 max-w-full box-border md:p-0 md:top-0 md:right-0 md:border-0 md:translate-y-0 md:w-80 md:ml-10">
        <label for="search-input">
          <input type="text" id="search-input"
            class="search-input bg-graylv1 dark:bg-[#252830] dark:text-white dark:placeholder-gray-400 rounded-[10px] px-5 py-2.5 placeholder:font-normal placehoder:text-graylv3 focus:outline-0 shadow-sm w-full"
            placeholder="Keyword" /></label>
        <div
          class="btn-cont flex gap-2 justify-cetner items-center absolute top-1/2 md:right-4 right-8 -translate-y-1/2">
          <button class="reset-inp-btn hidden">
            <span class="sr-only">검색어 초기화</span>
          </button>
          <button class="search-inp-btn">
            <span class="sr-only">검색하기</span>
          </button>
        </div>
      </div>
      <!-- // 메뉴 영역 -->

      <!-- 다크모드 토글 버튼 -->
      <button id="dark-mode-toggle" onclick="toggleDarkMode()" class="ml-4 md:ml-6 p-2 rounded-lg bg-graylv1 dark:bg-gray-800 text-graylv4 dark:text-gray-200 hover:bg-graylv2 dark:hover:bg-gray-700 transition-colors duration-200 flex items-center justify-center shrink-0" aria-label="다크 모드로 변경">
        <svg class="icon-sun w-5 h-5 hidden stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <svg class="icon-moon w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </button>
    </nav>
    <!-- 모바일에서 메뉴 영역이 보이도록 하는 영역 -->
    <div id="mobileMenu" class="absolute bg-background dark:bg-[#18191c] w-full max-w-[1190px] border-b border-graylv2 dark:border-gray-800 z-10 md:hidden">
    </div>
    <!-- // 모바일에서 메뉴 영역이 보이도록 하는 영역 -->
  </header>

  <!-- 카테고리 배너 영역 -->
  <div id="category-banner" class="hidden relative w-full bg-blue-50 dark:bg-blue-950/40 border-b border-blue-100 dark:border-blue-900">
    <div class="container mx-auto max-w-[1190px] px-8 py-5 flex justify-between items-center">
      <div>
        <p id="category-banner-desc" class="text-base font-medium text-gray-500 dark:text-gray-300"></p>
      </div>
      <button id="category-banner-close" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 focus:outline-none transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  </div>

  <main class="container p-8 pb-4 w-full mx-auto max-w-[1190px] md:pt-[40px]">

    <!-- 블로그 포스트 리스트 영역 -->
    <div id="blog-posts" class="grid md:grid-cols-2 lg:grid-cols-3 gap-x-[25px] lg:gap-y-10 gap-y-4 mb-20"></div>
    <!-- // 블로그 포스트 리스트 영역-->

    <!-- contents 영역 -->
    <div id="contents" class="mt-6 mb-28 grid-cols-3 max-w-[990px] mx-auto"></div>
    <!-- // contents 영역-->

    <!-- pagination -->
    <div id="pagination"></div>
  </main>

  <!-- category 검색 영역 -->
  <section
    class="category-aside hidden md:flex flex-col border border-graylv2 dark:border-gray-700 bg-white dark:bg-[#18191c] rounded-[10px] fixed top-24 right-8 overflow-y-auto w-fit h-fit">
    <header class="flex items-center">
      <h2 class="aside-tit sr-only text-sm font-semibold ml-5">content</h2>
      <button id="aside-button">
        <span class="sr-only">카테고리 열기</span>
      </button>
    </header>
    <aside></aside>
  </section>
  <!-- // category 검색 영역 -->

  <!-- utils -->
  <script src="js/utils.js"></script>
  <!-- convert ipynb to html -->
  <script src="style/convertIpynbToHtml.js"></script>

  <!-- style -->
  <script src="style/globalStyle.js"></script>
  <script src="style/blogContentsStyle.js"></script>

  <!-- mobile menu toggle -->
  <script src="js/mobileMenuToggle.js"></script>

  <!-- lender -->
  <script src="config.js"></script>
  <script src="js/URLparsing.js"></script>
  <script src="js/initData.js"></script>
  <script src="js/render.js"></script>

  <!-- registry -->
  <script src="js/registry.js"></script>
</body>

</html>
